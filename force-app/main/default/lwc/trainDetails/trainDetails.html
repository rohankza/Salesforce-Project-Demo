<template>

    <lightning-card title="Live Train Status" variant="narrow" icon-name="custom:custom36">
        <div class="slds-p-around_small">
            <lightning-input type="text" required="true" label="Enter Train Number" onchange={handleInputChange} ></lightning-input>
        </div>
        <div class="slds-p-around_small slds-p-left_large">
            <lightning-button label="Get Train Info" variant="Brand" onclick={handleTrainInfo}></lightning-button>
        </div>
        <template lwc:if={showSpinner}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>

        <template lwc:if={showTrainDetails}>
            <div class="slds-p-around_small slds-p-left_medium train-header">
                <div class="slds-text-heading_medium train-name">{trainDetails.train_name}</div>
                <div class="slds-text-body_small train-updated">Last updated: {trainDetails.updated_time}</div>
            </div>
            <div class="slds-p-top_x-small slds-p-horizontal_small" style="height: 300px;">
                <lightning-datatable
                    key-field="station_name"
                    data={trainDetails.data}
                    columns={columns}
                    hide-checkbox-column="true">
                </lightning-datatable>
            </div>
        </template>
    </lightning-card>
</template>
